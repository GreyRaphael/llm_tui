name: Release Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Multi-Platform Binaries & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Cross-Platform Binaries & Archives
        run: |
          mkdir -p dist/bin
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-X main.Version=${VERSION} -s -w"

          # 1. Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/linux-amd64/llm_tui .
          tar -czvf dist/llm_tui-${VERSION}-linux-amd64.tar.gz -C dist/linux-amd64 llm_tui

          # 2. Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/linux-arm64/llm_tui .
          tar -czvf dist/llm_tui-${VERSION}-linux-arm64.tar.gz -C dist/linux-arm64 llm_tui

          # 3. macOS Apple Silicon (arm64)
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/darwin-arm64/llm_tui .
          tar -czvf dist/llm_tui-${VERSION}-darwin-arm64.tar.gz -C dist/darwin-arm64 llm_tui

          # 4. macOS Intel (amd64)
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/darwin-amd64/llm_tui .
          tar -czvf dist/llm_tui-${VERSION}-darwin-amd64.tar.gz -C dist/darwin-amd64 llm_tui

          # 5. Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/windows-amd64/llm_tui.exe .
          zip -j dist/llm_tui-${VERSION}-windows-amd64.zip dist/windows-amd64/llm_tui.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
